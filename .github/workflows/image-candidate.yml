name: Prepare photographed briefing candidate
on:
  push:
    branches: ['codex/images-*']
  workflow_dispatch:
    inputs:
      edition:
        description: Reviewed edition ID
        required: true
        default: 2026-10-13-morning
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-v2.txt
      - name: Cache and verify the selected photographs
        env:
          EDITION_ID: ${{ inputs.edition }}
        run: |
          if [ -z "$EDITION_ID" ]; then
            EDITION_ID="$(python -c 'import json,pathlib; editions=[json.loads(p.read_text()) for p in pathlib.Path("content/editions").glob("*.json")]; print(max((e for e in editions if e.get("image_review")),key=lambda e:e["published_at"] or e["date"])["id"])')"
          fi
          python scripts/v2/prepare_images.py --edition "$EDITION_ID"
      - run: python scripts/v2/build.py
      - run: python -m unittest discover -s tests -v
      - run: python -m playwright install --with-deps chromium
      - run: python tests/browser_checks.py --screenshots .work/image-preview
      - run: python tests/frontend_polish_browser_checks.py --screenshots .work/image-preview/frontend-polish
      - run: python scripts/v2/release.py
      - run: git diff --exit-code -- docs/
      - uses: actions/upload-artifact@v4
        with:
          name: photographed-briefing-candidate
          path: |
            docs/
            .work/image-preview/
          include-hidden-files: true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: failed-image-preview
          path: .work/image-preview/
