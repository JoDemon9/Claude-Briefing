name: Verify served briefing release
on:
  workflow_dispatch:
    inputs:
      full_archive:
        description: Audit every archive file rather than changed/current files
        type: boolean
        default: false
  workflow_run:
    workflows: ['pages build and deployment', 'pages-build-deployment']
    types: [completed]
permissions:
  contents: read
concurrency:
  group: verify-public-pages
  cancel-in-progress: true
jobs:
  verify:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || 'main' }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        if: github.ref == 'refs/heads/main'
        with:
          path: .work/publication-check.json
          key: verified-public-pages-${{ github.event.workflow_run.head_sha || github.sha }}-${{ github.run_id }}
          restore-keys: verified-public-pages-
      - name: Verify changed files and essential current pages/assets
        env:
          FULL_ARCHIVE: ${{ inputs.full_archive && 'true' || 'false' }}
        run: |
          if [ "$FULL_ARCHIVE" = true ]; then
            python scripts/v2/release.py --verify-live --full
          else
            python scripts/v2/release.py --verify-live
          fi
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: verified-publication-receipt
          path: .work/publication-check.json
