name: Send briefing to Telegram
on:
  push:
    paths: ['docs/briefings/*.md', 'briefings/*.md']
  workflow_dispatch:
jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }

      - name: Resolve today's edition
        id: edition
        run: |
          md=$(ls -1 briefings/oracle-briefing-*.md | sort | tail -n 1)
          echo "md=$md" >> "$GITHUB_OUTPUT"

      - name: Build the published page
        run: python scripts/build-html.py "${{ steps.edition.outputs.md }}"

      - name: Check every link in the edition
        run: python scripts/check-links.py "${{ steps.edition.outputs.md }}"

      - name: Validate the edition against the house invariants
        run: python scripts/validate-edition.py "${{ steps.edition.outputs.md }}"

      - name: Send to Telegram
        run: python scripts/send-briefing.py "${{ steps.edition.outputs.md }}"
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BRIEFING_BASE_URL: ${{ vars.BRIEFING_BASE_URL }}
