name: Structured briefing checks
on:
  pull_request:
  push:
    branches: [main]
    paths: ['content/**', 'templates/v2/**', 'scripts/v2/**', 'tests/**', 'docs/**', 'BRIEFING_RUNTIME.md', '.github/workflows/content-checks.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-v2.txt
      - uses: actions/cache@v4
        with:
          path: .work/build-cache.json
          key: briefing-build-${{ github.ref }}-${{ github.sha }}
          restore-keys: briefing-build-${{ github.ref }}-
      - run: python -m playwright install --with-deps chromium
      - name: Validate one candidate and report blocking gates
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          CANDIDATE_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python scripts/v2/checks.py --base "$BASE_SHA"
      - name: Confirm generated files are committed
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: git diff --exit-code -- docs/
      - name: Return the exact built public candidate
        uses: actions/upload-artifact@v4
        with:
          name: briefing-built-candidate
          retention-days: 7
          path: docs/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: briefing-candidate-checks
          retention-days: 7
          path: |
            .work/check-report.json
            .work/check-logs/
