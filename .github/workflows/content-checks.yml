name: Structured briefing checks
on:
  pull_request:
  push:
    branches: [main]
    paths: ['content/**', 'templates/v2/**', 'scripts/v2/**', 'tests/**', 'docs/**', 'BRIEFING_RUNTIME.md', '.github/workflows/content-checks.yml']
  workflow_dispatch:
    inputs:
      full_regression:
        description: 'Also run the historical archive browser suites (maintenance audit only)'
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ORACLE_SKIP_LIVE_POLL: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-v2.txt pillow jsonschema
      - uses: actions/cache@v4
        with:
          path: .work/build-cache.json
          key: briefing-build-${{ github.ref }}-${{ github.sha }}
          restore-keys: briefing-build-${{ github.ref }}-
      - run: python -m playwright install --with-deps chromium
      - name: Validate one candidate and report blocking gates
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          CANDIDATE_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          FULL_REGRESSION: ${{ github.event.inputs.full_regression || 'false' }}
        run: |
          if [ "$FULL_REGRESSION" = "true" ]; then
            python scripts/v2/checks.py --base "$BASE_SHA" --profile full
          else
            python scripts/v2/checks.py --base "$BASE_SHA"
          fi
      - name: Commit and push built assets to Claude-Briefing
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "Oracle Briefing CI"
          git config user.email "actions@github.com"
          git add docs/ content/
          if ! git diff --staged --quiet; then
            git commit -m "chore(build): compile newspaper HTML and assets [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi
      - name: Sync to Central Portal (oracle-briefing)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.PORTAL_DEPLOY_TOKEN != ''
        env:
          PORTAL_TOKEN: ${{ secrets.PORTAL_DEPLOY_TOKEN }}
        run: |
          git clone "https://x-access-token:${PORTAL_TOKEN}@github.com/JoDemon9/oracle-briefing.git" /tmp/oracle-briefing
          python scripts/v2/sync_portal.py --portal-dir /tmp/oracle-briefing
          cd /tmp/oracle-briefing
          git config user.name "Oracle Briefing CI"
          git config user.email "actions@github.com"
          git add -A
          if ! git diff --staged --quiet; then
            git commit -m "publish: sync latest Oracle Briefing edition [skip ci]"
            git push origin main
          fi
      - name: Return the exact built public candidate
        uses: actions/upload-artifact@v4
        with:
          name: briefing-built-candidate
          retention-days: 7
          path: docs/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: briefing-candidate-checks
          retention-days: 7
          path: |
            .work/check-report.json
            .work/check-logs/
