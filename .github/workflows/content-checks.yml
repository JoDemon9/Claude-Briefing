name: Structured briefing checks
on:
  pull_request:
  push:
    branches: [main]
    paths: ['content/**', 'templates/v2/**', 'scripts/v2/**', 'tests/**', 'docs/**', 'requirements-v2.txt', 'AGENTS.md', 'CLAUDE.md', 'BRIEFING_SPEC.md', 'CHATGPT_TASK_INSTRUCTIONS.md', 'prompts/**', 'maintenance/OPERATIONS.md', 'maintenance/AUTHORING.md', '.github/workflows/content-checks.yml']
  workflow_dispatch:
    inputs:
      full_regression:
        description: 'Also run the historical archive browser suites (maintenance audit only)'
        type: boolean
        default: false
permissions:
  contents: write
  pages: write
concurrency:
  group: briefing-candidate-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-v2.txt pillow jsonschema
      - uses: actions/cache@v4
        with:
          path: .work/build-cache.json
          key: briefing-build-${{ github.ref }}-${{ github.sha }}
          restore-keys: briefing-build-${{ github.ref }}-
      - run: python -m playwright install --with-deps chromium
      - name: Validate one candidate and report blocking gates
        id: quality
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          CANDIDATE_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          FULL_REGRESSION: ${{ github.event.inputs.full_regression || 'false' }}
        run: |
          if [ "$FULL_REGRESSION" = "true" ]; then
            python scripts/v2/checks.py --base "$BASE_SHA" --profile full
          else
            python scripts/v2/checks.py --base "$BASE_SHA"
          fi
      - name: Preserve the exact checked public candidate before promotion
        uses: actions/upload-artifact@v4
        with:
          name: briefing-built-candidate
          retention-days: 7
          overwrite: true
          if-no-files-found: error
          path: |
            docs/
            content/
      - name: Save the check receipt for publication
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: briefing-gate-report
          retention-days: 7
          overwrite: true
          if-no-files-found: error
          path: .work/check-report.json
      - uses: actions/upload-artifact@v4
        if: always() && (failure() || github.event_name != 'push')
        with:
          name: briefing-candidate-checks
          retention-days: 7
          overwrite: true
          path: |
            .work/check-report.json
            .work/check-logs/

  publish:
    name: Publish and verify checked release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-v2.txt pillow jsonschema
      - uses: actions/download-artifact@v4
        with:
          name: briefing-built-candidate
          path: .work/checked-candidate
      - uses: actions/download-artifact@v4
        with:
          name: briefing-gate-report
          path: .work
      - name: Restore only the exact candidate and refuse stale inputs
        run: |
          git fetch origin refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          git diff --quiet "$GITHUB_SHA" origin/main -- content scripts/v2 templates/v2 .github/workflows
          git switch -C main "$GITHUB_SHA"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import shutil

          proof = json.loads(Path('.work/check-report.json').read_text())
          candidate = proof.get('candidate', {})
          if (proof.get('status') != 'passed'
                  or candidate.get('checked_commit_sha') != os.environ['GITHUB_SHA']
                  or str(candidate.get('workflow_run_id')) != os.environ['GITHUB_RUN_ID']):
              raise SystemExit('Check receipt does not belong to this workflow and commit')
          artifact = Path('.work/checked-candidate')
          if not (artifact / 'docs/data/release.json').is_file() or not (artifact / 'content').is_dir():
              raise SystemExit('Checked public artifact is missing its release manifest or content')
          for directory in ('docs', 'content'):
              shutil.rmtree(directory)
              (artifact / directory).rename(directory)
          PY
      - name: Require central publication credentials
        env:
          PORTAL_TOKEN: ${{ secrets.PORTAL_DEPLOY_TOKEN }}
        run: |
          if [ -z "$PORTAL_TOKEN" ]; then
            echo "PORTAL_DEPLOY_TOKEN is required for two-site publication. Candidate remains unpromoted."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          repository: JoDemon9/oracle-briefing
          token: ${{ secrets.PORTAL_DEPLOY_TOKEN }}
          path: .work/portal
          fetch-depth: 0
      - name: Publish exact checked candidate and verify both sites
        env:
          ORACLE_PAGES_BUILD_TOKEN: ${{ github.token }}
          ORACLE_PUBLIC_PUSH_TOKEN: ${{ github.token }}
          ORACLE_PORTAL_PUSH_TOKEN: ${{ secrets.PORTAL_DEPLOY_TOKEN }}
        run: |
          git config user.name "Oracle Briefing CI"
          git config user.email "actions@github.com"
          git -C .work/portal config user.name "Oracle Briefing CI"
          git -C .work/portal config user.email "actions@github.com"
          python scripts/v2/publish.py --portal-root .work/portal --checks-receipt .work/check-report.json --publish
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: briefing-candidate-checks
          retention-days: 7
          overwrite: true
          path: |
            .work/check-report.json
            .work/publication-state.json
